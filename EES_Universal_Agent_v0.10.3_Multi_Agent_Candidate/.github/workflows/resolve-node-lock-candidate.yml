name: Resolve Node Lockfile Candidate

on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Resolve exact dependency tree using npm
        working-directory: operational-fixtures/playwright-ui-state
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          node -e "const l=require('./package-lock.json'); if(l.lockfileVersion!==3) process.exit(2); for(const [k,v] of Object.entries(l.packages||{})){if(k.startsWith('node_modules/')&&(!v.resolved||!v.integrity)) process.exit(3)}"
      - name: Preserve the resolved lockfile for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ees-node-lock-candidate
          path: operational-fixtures/playwright-ui-state/package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify reproducible install and browser tests
        working-directory: operational-fixtures/playwright-ui-state
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
          npm test
